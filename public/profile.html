<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Bossjob Ethiopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f5f6fa; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; }
        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .avatar {
            width: 80px; height: 80px;
            background: #4CAF50; color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 800;
            margin: 0 auto 20px;
        }
        .name { font-size: 24px; font-weight: 800; margin-bottom: 5px; }
        .info { color: #666; margin-bottom: 20px; }
        .btn {
            padding: 12px 30px;
            border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600;
            font-family: inherit; font-size: 14px;
        }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-danger { background: #ff4444; color: white; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 5px; }
        .form-group input {
            width: 100%; padding: 10px;
            border: 1px solid #ddd; border-radius: 8px;
            font-family: inherit; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="avatar" id="avatar">U</div>
            <h1 class="name" id="name">Loading...</h1>
            <p class="info" id="phoneInfo">Loading...</p>
            <p class="info" id="roleInfo">Loading...</p>
            
            <div style="margin: 20px 0; text-align: left;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="City">
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="saveProfile()">Save Profile</button>
            <button class="btn btn-danger" onclick="logout()" style="margin-left:10px;">Logout</button>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        
        document.addEventListener('DOMContentLoaded', loadProfile);
        
        async function loadProfile() {
            const token = localStorage.getItem('authToken');
            
            if (!token) {
                window.location.href = '/';
                return;
            }
            
            try {
                const res = await fetch(API_URL + '/api/v1/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                
                if (data.success && data.data) {
                    const user = data.data;
                    document.getElementById('name').textContent = user.full_name || 'User';
                    document.getElementById('phoneInfo').textContent = '📱 ' + (user.phone_number || '');
                    document.getElementById('roleInfo').textContent = '👤 ' + (user.role || 'User');
                    document.getElementById('avatar').textContent = (user.full_name || 'U').charAt(0).toUpperCase();
                    document.getElementById('fullName').value = user.full_name || '';
                    document.getElementById('email').value = user.email || '';
                } else {
                    localStorage.removeItem('authToken');
                    window.location.href = '/';
                }
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('name').textContent = 'Error loading profile';
            }
        }
        
        async function saveProfile() {
            const token = localStorage.getItem('authToken');
            
            const data = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                current_location: document.getElementById('location').value,
            };
            
            try {
                const res = await fetch(API_URL + '/api/v1/candidates/update-profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.success ? '✅ Profile saved!' : '❌ Save failed');
            } catch (e) {
                alert('Error saving');
            }
        }
        
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userRole');
            window.location.href = '/';
        }
    </script>
</body>
</html>
