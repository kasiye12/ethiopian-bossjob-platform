<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Service - Bossjob Ethiopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --dark: #1a1a2e;
            --border: #e0e0e0;
            --bg: #f5f6fa;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); }
        
        .ai-container {
            max-width: 800px;
            margin: 0 auto;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }
        
        .ai-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ai-avatar {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
            70% { box-shadow: 0 0 0 12px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }
        .ai-header h1 { font-size: 18px; font-weight: 800; }
        .ai-header p { font-size: 12px; opacity: 0.9; }
        
        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: white;
        }
        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .msg-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message.user .msg-avatar { background: #4CAF50; }
        .message.ai .msg-avatar { background: #667eea; }
        .msg-bubble {
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 14px;
            max-width: 70%;
            line-height: 1.5;
        }
        .message.user .msg-bubble { background: #4CAF50; color: white; border-bottom-right-radius: 4px; }
        .message.ai .msg-bubble { background: #f5f6fa; color: #333; border-bottom-left-radius: 4px; }
        
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: white;
            border-top: 1px solid var(--border);
        }
        .suggestion-chip {
            padding: 8px 16px;
            background: #E8F5E9;
            color: #4CAF50;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
        }
        .suggestion-chip:hover { background: #4CAF50; color: white; }
        
        .ai-input {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid var(--border);
        }
        .ai-input input {
            flex: 1;
            padding: 13px 20px;
            border: 1px solid var(--border);
            border-radius: 25px;
            font-family: inherit;
            font-size: 14px;
        }
        .ai-input input:focus { outline: none; border-color: #4CAF50; }
        .send-btn {
            width: 48px;
            height: 48px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }
        .send-btn:hover { background: #388E3C; }
    </style>
</head>
<body>
    <div class="ai-container">
        <div class="ai-header">
            <div class="ai-avatar">🤖</div>
            <div>
                <h1>Bossjob AI Service</h1>
                <p>Intelligent assistant for jobs, resumes, and more</p>
            </div>
        </div>
        
        <div class="ai-messages" id="messagesArea">
            <div class="message ai">
                <div class="msg-avatar">🤖</div>
                <div class="msg-bubble">
                    Hello! 👋 I'm Bossjob AI Assistant.<br><br>
                    I can help you with:<br>
                    💼 Finding jobs<br>
                    📄 Resume creation<br>
                    🏢 Company registration<br>
                    📝 Job applications<br>
                    📅 Interview tips<br>
                    💰 Salary information
                </div>
            </div>
        </div>
        
        <div class="suggestions" id="suggestions">
            <button class="suggestion-chip" onclick="quickAsk('Find me IT jobs')">💼 IT Jobs</button>
            <button class="suggestion-chip" onclick="quickAsk('How to create a resume?')">📄 Resume</button>
            <button class="suggestion-chip" onclick="quickAsk('Register my company')">🏢 Company</button>
            <button class="suggestion-chip" onclick="quickAsk('Interview tips')">📅 Interview</button>
            <button class="suggestion-chip" onclick="quickAsk('Salary ranges')">💰 Salary</button>
            <button class="suggestion-chip" onclick="quickAsk('How to apply for jobs?')">📝 Apply</button>
        </div>
        
        <div class="ai-input">
            <input type="text" id="aiInput" placeholder="Ask me anything..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
    
    <script>
        const API = window.location.origin;
        
        function addMessage(text, type) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.innerHTML = `
                <div class="msg-avatar">${type === 'user' ? '👤' : '🤖'}</div>
                <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
            `;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('aiInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            try {
                const res = await fetch(API + '/api/v1/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                
                if (data.success) {
                    setTimeout(() => {
                        addMessage(data.data.response, 'ai');
                    }, 500);
                }
            } catch (e) {
                setTimeout(() => {
                    addMessage('Sorry, I encountered an error. Please try again.', 'ai');
                }, 500);
            }
        }
        
        function quickAsk(question) {
            document.getElementById('aiInput').value = question;
            sendMessage();
        }
        
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
        
        // Load suggestions
        fetch(API + '/api/v1/ai/suggestions')
            .then(r => r.json())
            .then(data => {
                if (data.success && data.data) {
                    const container = document.getElementById('suggestions');
                    container.innerHTML = data.data.map(s => 
                        `<button class="suggestion-chip" onclick="quickAsk('${s}')">${s}</button>`
                    ).join('');
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
