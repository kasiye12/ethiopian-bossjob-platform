<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs - Bossjob Ethiopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4CAF50;
            --dark: #1a1a2e;
            --border: #e0e0e0;
            --bg: #f5f6fa;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        
        .page-header { margin-bottom: 25px; }
        .page-header h1 { font-size: 28px; font-weight: 800; color: var(--dark); }
        
        /* Categories Section */
        .categories-section {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 25px;
        }
        .categories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .categories-header h2 { font-size: 18px; font-weight: 700; }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        .category-btn {
            padding: 15px 10px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-family: inherit;
        }
        .category-btn:hover {
            border-color: var(--primary);
            background: #E8F5E9;
            transform: translateY(-3px);
        }
        .category-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        .category-btn .icon { font-size: 28px; display: block; margin-bottom: 5px; }
        .category-btn .name { font-size: 13px; font-weight: 600; }
        .category-btn .count { font-size: 11px; opacity: 0.7; display: block; margin-top: 3px; }
        
        /* Search Bar */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 250px;
            padding: 12px 18px;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-family: inherit;
            font-size: 14px;
        }
        .search-bar input:focus { outline: none; border-color: var(--primary); }
        .search-bar button {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
        }
        
        /* Filters */
        .filters-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filters-bar select {
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            background: white;
        }
        
        /* Results */
        .results-count { color: #666; font-size: 13px; margin-bottom: 15px; }
        
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 18px;
        }
        .job-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            transition: all 0.3s;
        }
        .job-card:hover { transform: translateY(-4px); box-shadow: 0 6px 25px rgba(0,0,0,0.12); }
        .job-card h3 { font-size: 16px; margin-bottom: 4px; }
        .job-company { color: var(--primary); font-weight: 600; font-size: 14px; }
        .job-info { font-size: 13px; color: #666; margin: 8px 0; }
        .job-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
        .tag { padding: 4px 12px; background: #f5f5f5; border-radius: 50px; font-size: 11px; }
        .tag.remote { background: #E3F2FD; color: #2196F3; }
        .job-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-apply {
            flex: 1; padding: 9px; background: var(--primary); color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: 700;
        }
        .btn-details {
            padding: 9px 15px; background: white; color: var(--primary);
            border: 1px solid var(--primary); border-radius: 6px; cursor: pointer;
        }
        .empty-state { text-align: center; color: #999; padding: 50px; grid-column: 1/-1; }
    </style>
</head>
<body>
    <header class="navbar" id="appNavbar"></header>

    <div class="container">
        <div class="page-header">
            <h1>💼 Find Jobs</h1>
        </div>
        
        <!-- Explore by Category -->
        <div class="categories-section">
            <div class="categories-header">
                <h2>📂 Explore by Category</h2>
                <button onclick="resetCategory()" style="padding:6px 14px;background:transparent;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;">Reset</button>
            </div>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Categories loaded here -->
            </div>
        </div>
        
        <!-- Search -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search jobs by title, company, or keyword..." onkeypress="if(event.key==='Enter')loadJobs()">
            <button onclick="loadJobs()">🔍 Search</button>
        </div>
        
        <!-- Filters -->
        <div class="filters-bar">
            <select id="typeFilter" onchange="loadJobs()">
                <option value="">All Job Types</option>
                <option value="Remote">Remote</option>
                <option value="On-site">On-site</option>
            </select>
            <select id="regionFilter" onchange="loadJobs()">
                <option value="">All Regions</option>
                <option value="Addis Ababa">Addis Ababa</option>
                <option value="Oromia">Oromia</option>
            </select>
            <select id="experienceFilter" onchange="loadJobs()">
                <option value="">Any Experience</option>
                <option value="1-3">1-3 Years</option>
                <option value="3-5">3-5 Years</option>
                <option value="5-10">5-10 Years</option>
            </select>
        </div>
        
        <!-- Results -->
        <div class="results-count" id="resultsCount"></div>
        
        <div class="jobs-grid" id="jobsList">
            <p class="empty-state">Loading jobs...</p>
        </div>
    </div>

    <footer class="footer" id="appFooter"></footer>

    <script src="/js/i18n.js"></script>
    <script src="/js/master-layout.js"></script>
    <script src="/js/apply-modal.js"></script>
    <script src="/js/job-apply.js"></script>
    <script>
        const API = window.location.origin;
        let allJobs = [];
        let selectedCategory = '';
        
        const categories = [
            { name: 'IT & Technology', icon: '💻', category: 'IT' },
            { name: 'Finance', icon: '💰', category: 'Finance' },
            { name: 'Healthcare', icon: '🏥', category: 'Healthcare' },
            { name: 'Education', icon: '📚', category: 'Education' },
            { name: 'Engineering', icon: '⚙️', category: 'Engineering' },
            { name: 'Sales', icon: '📈', category: 'Sales' },
            { name: 'Marketing', icon: '📢', category: 'Marketing' },
            { name: 'Customer Service', icon: '🎧', category: 'Customer Service' },
        ];
        
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadAllJobs();
        });
        
        function loadCategories() {
            const container = document.getElementById('categoriesGrid');
            
            // Check URL for category param
            const params = new URLSearchParams(window.location.search);
            const urlCategory = params.get('category');
            if (urlCategory) selectedCategory = urlCategory;
            
            container.innerHTML = categories.map(cat => `
                <button class="category-btn ${selectedCategory === cat.category ? 'active' : ''}" 
                        onclick="filterByCategory('${cat.category}')">
                    <span class="icon">${cat.icon}</span>
                    <span class="name">${cat.name}</span>
                    <span class="count" id="count-${cat.category}">0 jobs</span>
                </button>
            `).join('');
        }
        
        async function loadAllJobs() {
            try {
                const res = await fetch(API + '/api/v1/jobs?limit=100');
                const data = await res.json();
                allJobs = data.data || [];
                
                // Update category counts
                updateCategoryCounts();
                
                // Apply filters
                applyFilters();
            } catch (e) {}
        }
        
        function updateCategoryCounts() {
            categories.forEach(cat => {
                const count = allJobs.filter(j => j.category === cat.category).length;
                const countEl = document.getElementById('count-' + cat.category);
                if (countEl) countEl.textContent = count + ' jobs';
            });
        }
        
        function filterByCategory(category) {
            selectedCategory = category;
            
            // Update active states
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.category-btn').classList.add('active');
            
            applyFilters();
        }
        
        function resetCategory() {
            selectedCategory = '';
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            applyFilters();
        }
        
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            const region = document.getElementById('regionFilter').value;
            const experience = document.getElementById('experienceFilter').value;
            
            let filtered = allJobs;
            
            // Category filter
            if (selectedCategory) {
                filtered = filtered.filter(j => j.category === selectedCategory);
            }
            
            // Search filter
            if (search) {
                filtered = filtered.filter(j => 
                    (j.title || '').toLowerCase().includes(search) ||
                    (j.company_name || '').toLowerCase().includes(search)
                );
            }
            
            // Type filter
            if (type) filtered = filtered.filter(j => j.job_type === type);
            
            // Region filter
            if (region) filtered = filtered.filter(j => j.region === region);
            
            // Experience filter
            if (experience) {
                filtered = filtered.filter(j => (j.experience_level || '').includes(experience));
            }
            
            renderJobs(filtered);
        }
        
        function renderJobs(jobs) {
            const container = document.getElementById('jobsList');
            const resultsCount = document.getElementById('resultsCount');
            
            resultsCount.textContent = `${jobs.length} jobs found${selectedCategory ? ' in ' + selectedCategory : ''}`;
            
            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size:40px;margin-bottom:10px;">🔍</p>
                        <p>No jobs found matching your criteria</p>
                        <button onclick="resetCategory()" style="margin-top:15px;padding:10px 20px;background:#4CAF50;color:white;border:none;border-radius:6px;cursor:pointer;">Reset Filters</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <h3>${job.title}</h3>
                    <p class="job-company">${job.company_name || 'Company'}</p>
                    <p class="job-info">📍 ${job.region} | 💰 ${job.salary_min_etb ? 'ETB ' + Number(job.salary_min_etb).toLocaleString() : 'Negotiable'}</p>
                    <div class="job-tags">
                        <span class="tag ${job.job_type === 'Remote' ? 'remote' : ''}">${job.job_type}</span>
                        <span class="tag">${job.category || 'General'}</span>
                        <span class="tag">${job.experience_level || 'Any'}</span>
                    </div>
                    <div class="job-actions">
                        <button class="btn-apply" onclick="handleApply('${job.id}', '${job.title}')">Apply Now</button>
                        <button class="btn-details" onclick="location.href='/job-details.html?id=${job.id}'">Details</button>
                    </div>
                </div>
            `).join('');
        }
        
        function loadJobs() {
            applyFilters();
        }
    </script>
</body>
</html>
