<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Bossjob Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4CAF50;
            --danger: #ff4444;
            --dark: #1a1a2e;
            --border: #e0e0e0;
            --bg: #f5f6fa;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--dark); }
        
        .role-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .role-tab {
            padding: 9px 18px;
            border: 1px solid var(--border);
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            background: white;
            transition: all 0.3s;
        }
        .role-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .role-tab .count { opacity: 0.7; font-size: 11px; }
        
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th {
            background: #fafafa;
            padding: 14px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            color: #999;
            border-bottom: 1px solid var(--border);
        }
        td { padding: 14px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        tr:hover { background: #fafafa; }
        
        .user-cell { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: white;
        }
        .avatar-admin { background: #9C27B0; }
        .avatar-boss { background: #2196F3; }
        .avatar-candidate { background: #4CAF50; }
        
        .role-badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .role-admin { background: #F3E5F5; color: #9C27B0; }
        .role-boss { background: #E3F2FD; color: #2196F3; }
        .role-candidate { background: #E8F5E9; color: #4CAF50; }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            margin: 1px;
            transition: all 0.2s;
        }
        .btn-edit { background: #FFF3CD; color: #856404; }
        .btn-edit:hover { background: #FF9800; color: white; }
        .btn-reset { background: #E3F2FD; color: #2196F3; }
        .btn-reset:hover { background: #2196F3; color: white; }
        .btn-toggle { background: #F8D7DA; color: #721C24; }
        .btn-toggle:hover { background: #ff4444; color: white; }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            padding: 25px;
            animation: modalIn 0.25s;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
        }
        .modal-actions { display: flex; gap: 8px; margin-top: 15px; }
        .modal-actions button { flex: 1; padding: 10px; font-size: 13px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-cancel { background: #f5f5f5; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 User Management</h1>
        </div>
        
        <!-- Role Tabs -->
        <div class="role-tabs">
            <button class="role-tab active" id="tab-all" onclick="switchRole('all')">All Users</button>
            <button class="role-tab" id="tab-admin" onclick="switchRole('admin')">👑 Admins</button>
            <button class="role-tab" id="tab-boss" onclick="switchRole('boss')">🏢 Employers</button>
            <button class="role-tab" id="tab-candidate" onclick="switchRole('candidate')">👤 Candidates</button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="5" style="text-align:center;color:#999;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h2>✏️ Edit User</h2>
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="editEmail">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="editRole">
                    <option value="candidate">Candidate</option>
                    <option value="boss">Employer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="form-group">
                <label>Company Position</label>
                <select id="editPosition">
                    <option value="">None</option>
                    <option value="Owner">Owner</option>
                    <option value="CEO">CEO</option>
                    <option value="HR Director">HR Director</option>
                    <option value="HR Manager">HR Manager</option>
                    <option value="HR Officer">HR Officer</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-primary" onclick="saveEdit()">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Reset Password Modal -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal-box">
            <h2>🔑 Reset Password</h2>
            <input type="hidden" id="resetUserId">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPass" placeholder="Min 8 characters">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPass">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeResetModal()">Cancel</button>
                <button class="btn-primary" onclick="resetPassword()">Reset</button>
            </div>
        </div>
    </div>
    
    <script>
        const API = window.location.origin;
        const token = localStorage.getItem('authToken');
        let allUsers = [];
        let currentRole = 'all';
        
        document.addEventListener('DOMContentLoaded', loadUsers);
        
        async function loadUsers() {
            try {
                const res = await fetch(API + '/api/v1/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                allUsers = data.data || [];
                renderUsers();
            } catch (e) {
                console.error('Error:', e);
            }
        }
        
        function switchRole(role) {
            currentRole = role;
            
            // Update tabs
            document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + role).classList.add('active');
            
            renderUsers();
        }
        
        function renderUsers() {
            const body = document.getElementById('usersBody');
            
            let users = allUsers;
            if (currentRole !== 'all') {
                users = allUsers.filter(u => u.role === currentRole);
            }
            
            if (users.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">No users found</td></tr>';
                return;
            }
            
            body.innerHTML = users.map(u => `
                <tr>
                    <td>
                        <div class="user-cell">
                            <div class="avatar avatar-${u.role}">${(u.full_name || 'U').charAt(0).toUpperCase()}</div>
                            <div>
                                <strong>${u.full_name}</strong>
                                <div style="font-size:11px;color:#999;">${u.email || ''}</div>
                            </div>
                        </div>
                    </td>
                    <td>${u.phone_number}</td>
                    <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                    <td>${u.is_active ? '✅ Active' : '❌ Inactive'}</td>
                    <td>
                        <button class="btn btn-edit" onclick="openEditModal('${u.id}')">✏️ Edit</button>
                        <button class="btn btn-reset" onclick="openResetModal('${u.id}')">🔑 Reset</button>
                        <button class="btn btn-toggle" onclick="toggleUserStatus('${u.id}')">${u.is_active ? '🔒' : '🔓'}</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // Edit Functions
        function openEditModal(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editName').value = user.full_name || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editRole').value = user.role || 'candidate';
            document.getElementById('editPosition').value = user.company_position || '';
            document.getElementById('editModal').classList.add('show');
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }
        
        async function saveEdit() {
            const userId = document.getElementById('editUserId').value;
            
            const data = {
                full_name: document.getElementById('editName').value,
                email: document.getElementById('editEmail').value,
                role: document.getElementById('editRole').value,
                company_position: document.getElementById('editPosition').value,
            };
            
            try {
                const res = await fetch(API + '/api/v1/admin/users/' + userId, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                
                if (result.success) {
                    alert('✅ User updated!');
                    closeEditModal();
                    loadUsers();
                } else {
                    alert('❌ ' + (result.message || 'Failed'));
                }
            } catch (e) {
                alert('Error saving');
            }
        }
        
        // Password Reset Functions
        function openResetModal(userId) {
            document.getElementById('resetUserId').value = userId;
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';
            document.getElementById('resetModal').classList.add('show');
        }
        
        function closeResetModal() {
            document.getElementById('resetModal').classList.remove('show');
        }
        
        async function resetPassword() {
            const userId = document.getElementById('resetUserId').value;
            const pass = document.getElementById('newPass').value;
            const confirm = document.getElementById('confirmPass').value;
            
            if (pass.length < 8) {
                alert('Password must be at least 8 characters');
                return;
            }
            if (pass !== confirm) {
                alert('Passwords do not match');
                return;
            }
            
            try {
                const res = await fetch(API + '/api/v1/admin/users/' + userId + '/reset-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ new_password: pass })
                });
                
                const result = await res.json();
                
                if (result.success) {
                    alert('✅ Password reset!');
                    closeResetModal();
                } else {
                    alert('❌ ' + (result.message || 'Failed'));
                }
            } catch (e) {
                alert('Error resetting');
            }
        }
        
        // Toggle User Status
        async function toggleUserStatus(userId) {
            try {
                const res = await fetch(API + '/api/v1/admin/users/' + userId + '/toggle', {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const result = await res.json();
                
                if (result.success) {
                    loadUsers();
                }
            } catch (e) {
                console.error('Toggle error:', e);
            }
        }
        
        // Close modals on outside click
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('show');
            }
        });
    </script>
</body>
</html>
