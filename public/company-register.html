<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Company - Bossjob Ethiopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4CAF50;
            --dark: #1a1a2e;
            --border: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f5f6fa; }
        .container { max-width: 650px; margin: 30px auto; padding: 20px; }
        
        .form-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-header h1 { font-size: 24px; font-weight: 800; color: var(--dark); margin-bottom: 5px; }
        .form-header p { color: #999; font-size: 14px; }
        
        .section { margin-bottom: 25px; }
        .section h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary);
        }
        
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-submit:hover { background: #388E3C; }
        
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="navbar" id="appNavbar"></header>

    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1>🏢 Register Your Company</h1>
                <p>Link your company to your account</p>
            </div>
            
            <form onsubmit="registerCompany(event)">
                <div class="section">
                    <h2>Company Information</h2>
                    <div class="form-group">
                        <label>Company Name *</label>
                        <input type="text" id="companyName" placeholder="e.g., Tech Solutions PLC" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Industry *</label>
                            <select id="industry" required>
                                <option value="">Select</option>
                                <option value="Technology">Technology</option>
                                <option value="Finance">Finance</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Education">Education</option>
                                <option value="Retail">Retail</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Company Size *</label>
                            <select id="companySize" required>
                                <option value="">Select</option>
                                <option value="1-10">1-10</option>
                                <option value="11-50">11-50</option>
                                <option value="51-200">51-200</option>
                                <option value="201-500">201-500</option>
                                <option value="500+">500+</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>Legal Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>TIN Number *</label>
                            <input type="text" id="tinNumber" placeholder="Tax ID Number" required>
                        </div>
                        <div class="form-group">
                            <label>Business License *</label>
                            <input type="text" id="licenseNumber" placeholder="License Number" required>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>Location</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Region *</label>
                            <select id="region" required>
                                <option value="">Select</option>
                                <option value="Addis Ababa">Addis Ababa</option>
                                <option value="Oromia">Oromia</option>
                                <option value="Amhara">Amhara</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Sub City</label>
                            <input type="text" id="subCity" placeholder="e.g., Bole">
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>Your Position</h2>
                    <div class="form-group">
                        <label>Your Role in Company *</label>
                        <select id="companyPosition" required>
                            <option value="">Select Position</option>
                            <option value="Owner">Owner</option>
                            <option value="Founder">Founder</option>
                            <option value="CEO">CEO</option>
                            <option value="HR Director">HR Director</option>
                            <option value="HR Manager">HR Manager</option>
                            <option value="HR Officer">HR Officer</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Register Company</button>
            </form>
        </div>
    </div>

    <footer class="footer" id="appFooter"></footer>

    <script src="/js/master-layout.js"></script>
    <script>
        async function registerCompany(e) {
            e.preventDefault();
            
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('Please login first');
                window.location.href = '/';
                return;
            }
            
            const data = {
                company_name: document.getElementById('companyName').value,
                industry: document.getElementById('industry').value,
                company_size: document.getElementById('companySize').value,
                tin_number: document.getElementById('tinNumber').value,
                business_license_number: document.getElementById('licenseNumber').value,
                region: document.getElementById('region').value,
                sub_city: document.getElementById('subCity').value,
                company_position: document.getElementById('companyPosition').value,
                phone_number: '+251911223344',
                email: 'info@company.com',
                description: 'Company description',
            };
            
            try {
                const res = await fetch('/api/v1/companies/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                
                if (result.success) {
                    alert('✅ Company registered successfully!');
                    window.location.href = '/hr-dashboard.html';
                } else {
                    alert(result.message || 'Registration failed');
                }
            } catch (err) {
                alert('Error registering company');
            }
        }
    </script>
</body>
</html>
