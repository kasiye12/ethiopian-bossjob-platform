version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bossjob_postgres_prod
    environment:
      POSTGRES_DB: bossjob_ethiopia
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - bossjob_network

  redis:
    image: redis:7-alpine
    container_name: bossjob_redis_prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - bossjob_network

  app:
    build: .
    container_name: bossjob_app_prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bossjob_ethiopia
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - bossjob_network

  nginx:
    image: nginx:alpine
    container_name: bossjob_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: always
    networks:
      - bossjob_network

volumes:
  postgres_data:
  redis_data:

networks:
  bossjob_network:
    driver: bridge
